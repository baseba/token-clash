<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#15122a">
  <title>Token Clash</title>
  <meta name="description" content="Batallas contra otros jugadores con los Pokémon que criaste con tus tokens.">
  <link rel="icon" href="/icons/token-ball.svg?v=dev" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest?v=dev">
  <link rel="apple-touch-icon" href="/icons/token-ball-apple-180.png?v=dev">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Token Clash">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="/style.css?v=dev">
  <script type="module" src="/app.js?v=dev"></script>
  <!-- Every request to our domain crosses Cloudflare and the tunnel, a long round trip. Without these
       hints the browser finds each module only after the one that imports it arrives, and the
       manifests the first paint waits for only after every module ran. test/web/index.test.js keeps
       the list equal to the import graph. -->
  <link rel="modulepreload" href="/ball-burst.js?v=dev">
  <link rel="modulepreload" href="/ball-fx.js?v=dev">
  <link rel="modulepreload" href="/backgrounds.js?v=dev">
  <link rel="modulepreload" href="/battle-anims.js?v=dev">
  <link rel="modulepreload" href="/creature.js?v=dev">
  <link rel="modulepreload" href="/fx.js?v=dev">
  <link rel="modulepreload" href="/glyphs.js?v=dev">
  <link rel="modulepreload" href="/music.js?v=dev">
  <link rel="modulepreload" href="/notify.js?v=dev">
  <link rel="modulepreload" href="/radio.js?v=dev">
  <link rel="modulepreload" href="/radio-station.js?v=dev">
  <link rel="modulepreload" href="/savestore.js?v=dev">
  <link rel="modulepreload" href="/shop.js?v=dev">
  <link rel="modulepreload" href="/trainer-sprites.js?v=dev">
  <link rel="modulepreload" href="/trainer-variants.js?v=dev">
  <link rel="modulepreload" href="/types.js?v=dev">
  <link rel="modulepreload" href="/stat-formula.js?v=dev">
  <link rel="modulepreload" href="/natures.js?v=dev">
  <link rel="modulepreload" href="/overworld.js?v=dev">
  <link rel="modulepreload" href="/tower-map.js?v=dev">
  <link rel="modulepreload" href="/tower-tiles.js?v=dev">
  <link rel="modulepreload" href="/tower-cast.js?v=dev">
  <link rel="modulepreload" href="/upstream.js?v=dev">
  <link rel="preload" as="fetch" crossorigin href="/upstream/sprites.json?v=dev">
  <link rel="preload" as="fetch" crossorigin href="/trainers/faces.json?v=dev">
</head>
<body>
  <header class="top">
    <a class="logo" href="/" data-link><img class="logo-mark" src="/icons/token-ball.svg?v=dev" alt="" width="34" height="34"> <span class="logo-text">Token Clash</span></a>
    <nav class="nav" aria-label="Principal">
      <a href="/" data-link data-nav="home" data-tip="Inicio" aria-label="Inicio"></a>
      <a href="/coleccion" data-link data-nav="collection" data-tip="Colección" aria-label="Colección"></a>
      <a href="/pokedex" data-link data-nav="pokedex" data-tip="Pokédex" aria-label="Pokédex"></a>
      <a href="/perfil" data-link data-nav="profile" data-tip="Perfil" aria-label="Perfil"></a>
      <a href="/stats" data-link data-nav="stats" data-tip="Stats" aria-label="Stats"></a>
      <a href="/reciclaje" data-link data-nav="recycling" data-tip="Reciclaje" aria-label="Reciclaje"></a>
    </nav>
    <div id="sound"></div>
    <div id="who"></div>
  </header>
  <main id="app"><div class="loading-screen" role="status" aria-live="polite"><span class="loading-ball"><img src="/icons/token-ball.svg?v=dev" alt="" draggable="false"></span><p class="loading-text">Cargando…</p></div></main>
  <footer class="credits"><p>Datos y sprites de <a href="https://pokeapi.co" rel="noopener" target="_blank">PokeAPI</a></p></footer>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
